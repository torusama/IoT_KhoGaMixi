services:
  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./.runtime/mosquitto/passwords:/mosquitto/config/passwords:ro
      - ./.runtime/mosquitto/acl:/mosquitto/config/acl:ro
      - mqtt-data:/mosquitto/data
  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      MQTT_URL: mqtt://mqtt:1883
    ports:
      - "127.0.0.1:1880:1880"
    volumes:
      - backend-data:/app/.runtime
    depends_on:
      - mqtt
volumes:
  mqtt-data:
  backend-data:
